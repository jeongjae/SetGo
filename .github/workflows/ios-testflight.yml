name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (match the existing TestFlight version, for example 1.0)'
        required: true
        default: '1.0'
        type: string
      build_number:
        description: 'New build number, higher than the last upload (for example 2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: setgo-testflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build_number }}

jobs:
  preflight:
    name: Check release settings and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check inputs and required secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo '::error::Version must look like 1.0 or 1.0.0.'; exit 1;
          }
          [[ "$RELEASE_BUILD" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]] || {
            echo '::error::Use a positive build number, for example 2. See docs/github-actions-testflight.md.'; exit 1;
          }
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/github-actions-testflight.md."
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- --run
      - run: python3 -m unittest discover -s scripts/tests -p 'test_ios_release.py'

  release:
    name: Archive and upload to TestFlight
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # macos-15 still defaults to Xcode 16.4; App Store uploads need the iOS 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Xcode
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo '::error::Xcode 26.3 is missing from this runner. Update DEVELOPER_DIR to an installed stable Xcode 26+.'
            exit 1
          fi
          xcodebuild -version
          major="$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)"
          if (( major < 26 )); then
            echo '::error::Capacitor 8 needs Xcode 26 or newer. Update the runner image.'
            exit 1
          fi

      - run: npm ci
      - name: Build web app and sync iOS on macOS
        run: npm run native:sync

      - name: Install signing credentials in a temporary keychain
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/setgo-signing"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'setgo-signing'
          for name, filename in [
              ('IOS_DISTRIBUTION_P12_BASE64', 'distribution.p12'),
              ('IOS_PROVISION_PROFILE_BASE64', 'profile.mobileprovision'),
          ]:
              encoded = ''.join(os.environ[name].split())
              (folder / filename).write_bytes(base64.b64decode(encoded, validate=True))
          (folder / 'AuthKey.p8').write_text(os.environ['APP_STORE_CONNECT_API_KEY_P8'].strip() + '\n')
          PY
          keychain="$RUNNER_TEMP/setgo-signing/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/setgo-signing/distribution.p12" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/setgo-signing/profile.mobileprovision" \
            > "$RUNNER_TEMP/setgo-signing/profile.plist"
          security find-identity -v -p codesigning "$keychain" \
            > "$RUNNER_TEMP/setgo-signing/identities.txt"

      - name: Validate signing profile and prepare release settings
        run: python3 scripts/prepare-ios-release.py

      - name: Archive signed iPhone app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/SetGo.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/setgo-derived-data" \
            archive 2>&1 | tee build/ios-archive.log

      - name: Upload archive to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/SetGo.xcarchive" \
            -exportPath "$RUNNER_TEMP/setgo-export" \
            -exportOptionsPlist "$RUNNER_TEMP/setgo-signing/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/setgo-signing/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates 2>&1 | tee build/ios-upload.log
          {
            echo '### SetGo uploaded to App Store Connect'
            echo "Version: $RELEASE_VERSION ($RELEASE_BUILD)"
            echo "Commit: $GITHUB_SHA"
            echo 'Wait for Apple processing, resolve any export-compliance questions, then add the build to the existing TestFlight tester group.'
            echo 'Keep the existing iPhone app installed and update it through TestFlight.'
            echo 'Upload success does not mean Apple processing or tester distribution is complete.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build and upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-archive.log
            build/ios-upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          keychain="$RUNNER_TEMP/setgo-signing/signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
          python3 - <<'PY'
          import os, plistlib, shutil
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'setgo-signing'
          profile = folder / 'profile.plist'
          if profile.exists():
              try:
                  uuid = plistlib.loads(profile.read_bytes())['UUID']
                  # Only remove a profile installed under its validated UUID filename.
                  import uuid as uuid_module
                  uuid = str(uuid_module.UUID(uuid)).upper()
                  for location in ['Library/MobileDevice/Provisioning Profiles', 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
                      (Path.home() / location / f'{uuid}.mobileprovision').unlink(missing_ok=True)
              except (ValueError, KeyError, plistlib.InvalidFileException):
                  pass
          shutil.rmtree(folder, ignore_errors=True)
          PY
